<!DOCTYPE html>

<style>
:root{--bg:#fff0f5;--card:#fff;--ink:#5a2a3c;--mute:#9a6a7e;--accent:#e8588a;--soft:#ffd1e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--card:#3a1f2c;--ink:#ffe3ec;--mute:#d9a3b8;--accent:#ff7fab;--soft:#52293b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1620;--card:#3a1f2c;--ink:#ffe3ec;--mute:#d9a3b8;--accent:#ff7fab;--soft:#52293b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Quicksand",system-ui,sans-serif;line-height:1.75;font-size:16px;overflow-x:hidden}
main{max-width:480px;margin:0 auto;padding:0 20px 120px}
section{padding:36px 0}
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
h1,h2{font-family:"Dancing Script",cursive,serif;color:var(--accent);font-weight:600;margin:0 0 12px;line-height:1.2}
h1{font-size:2.8rem}h2{font-size:2.1rem;text-align:center}
.sub{color:var(--mute);font-size:1.05rem;margin:0}
.big{font-size:3.4rem;animation:beat 1.6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.hint{margin-top:36px;color:var(--mute);font-size:.85rem}
.card{background:var(--card);border-radius:22px;padding:24px;box-shadow:0 8px 24px rgba(232,88,138,.15)}
.letter{white-space:pre-line}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph{margin:0;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(232,88,138,.15);position:relative}
.ph img,.ph .empty{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.empty{background:linear-gradient(135deg,var(--soft),var(--accent));display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:#fff}
.ph figcaption{padding:10px 12px;font-size:.88rem;text-align:center;color:var(--mute)}
.chg{display:none;position:absolute;top:8px;left:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.78rem;text-align:center;padding:6px;border-radius:12px;cursor:pointer}
.editing .chg{display:block}
.reason{display:flex;gap:14px;margin-bottom:14px}
.reason b{display:block;color:var(--accent)}
.reason .n{flex:none;width:38px;height:38px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center}
.closing{text-align:center;font-family:"Dancing Script",cursive,serif;font-size:1.7rem;color:var(--accent);white-space:pre-line}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none;gap:10px;justify-content:center;z-index:5}
.bar button{border:0;border-radius:999px;padding:12px 22px;font:600 .95rem "Quicksand",sans-serif;background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(232,88,138,.4)}
.bar button.g{background:var(--card);color:var(--accent)}
.editing [contenteditable]{outline:2px dashed var(--accent);outline-offset:4px;border-radius:6px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.85rem;z-index:9;display:none}
.fl{position:absolute;pointer-events:none;opacity:.5;animation:up 7s linear infinite}
@keyframes up{from{transform:translateY(40px);opacity:0}20%{opacity:.6}to{transform:translateY(-70vh);opacity:0}}
@media (prefers-reduced-motion:reduce){.big,.fl{animation:none}}
</style>
</head>

<script>
const S=JSON.parse(document.getElementById('data').textContent);
const root=document.getElementById('root'),bar=document.getElementById('bar'),toast=document.getElementById('toast');
let artifact=null,canEdit=false,editing=false,backup=null;
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ce=p=>`data-p="${p}"${editing?' contenteditable="true"':''}`;
function setP(p,v){const k=p.split('.');let o=S;while(k.length>1)o=o[k.shift()];o[k[0]]=v}
function say(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',2600)}
function render(){
  document.body.classList.toggle('editing',editing);
  const hearts=[8,30,55,78].map((l,i)=>`<span class="fl" style="left:${l}%;bottom:10%;animation-delay:${i*1.7}s">♥</span>`).join('');
  root.innerHTML=`
  <section class="hero">${hearts}<div class="big">💗</div>
    <h1 ${ce('title')}>${e(S.title)}</h1><p class="sub" ${ce('sub')}>${e(S.sub)}</p>
    <p class="hint" ${ce('hint')}>${e(S.hint)}</p></section>
  <section><h2 ${ce('aTitle')}>${e(S.aTitle)}</h2><div class="card letter" ${ce('apology')}>${e(S.apology)}</div></section>
  <section><h2 ${ce('pTitle')}>${e(S.pTitle)}</h2><div class="grid">
  ${S.photos.map((p,i)=>`<figure class="ph">${p.src?`<img src="${e(p.src)}" alt="">`:'<div class="empty">♥</div>'}
    <label class="chg">Ganti foto<input type="file" accept="image/*" hidden data-i="${i}"></label>
    <figcaption ${ce('photos.'+i+'.cap')}>${e(p.cap)}</figcaption></figure>`).join('')}</div></section>
  <section><h2 ${ce('rTitle')}>${e(S.rTitle)}</h2>
  ${S.reasons.map((r,i)=>`<div class="reason"><div class="n">♥</div><div><b ${ce('reasons.'+i+'.t')}>${e(r.t)}</b><span ${ce('reasons.'+i+'.d')}>${e(r.d)}</span></div></div>`).join('')}</section>
  <section><div class="closing" ${ce('closing')}>${e(S.closing)}</div></section>`;
  bar.style.display=canEdit?'flex':'none';
  bar.innerHTML=editing?'<button class="g" id="cancel">Batal</button><button id="save">Simpan</button>':'<button id="edit">✏️ Edit halaman</button>';
  const b=id=>document.getElementById(id);
  if(b('edit'))b('edit').onclick=()=>{backup=JSON.stringify(S);editing=true;render()};
  if(b('cancel'))b('cancel').onclick=()=>{Object.assign(S,JSON.parse(backup));editing=false;render()};
  if(b('save'))b('save').onclick=save;
}
root.addEventListener('input',ev=>{const p=ev.target.dataset&&ev.target.dataset.p;if(p)setP(p,ev.target.innerText)});
root.addEventListener('change',async ev=>{
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  try{S.photos[+ev.target.dataset.i].src=await shrink(f);render()}catch(x){say('Foto gagal dimuat')}
});
function shrink(file){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const m=900,r=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};img.onerror=no;img.src=u})}
async function save(){
  if(!artifact){say('Penyimpanan belum tersedia');return}
  const d=document.documentElement.cloneNode(true);
  d.querySelector('#root').innerHTML='';d.querySelector('#bar').innerHTML='';
  d.querySelector('#toast').style.display='none';d.querySelector('body').classList.remove('editing');
  d.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  say('Menyimpan…');
  try{await artifact.publish('<!DOCTYPE html>\n'+d.outerHTML)}catch(x){say('Gagal menyimpan, coba lagi')}
}
render();
(async()=>{try{
  if(!window.claude)return;
  const u=await claude.use('user');artifact=await claude.use('artifact');
  canEdit=!!(artifact&&u&&(u.canEdit()||u.isOwner()));render();
}catch(x){}})();
</script>
